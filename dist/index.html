<!doctype html>
<html lang="ru" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161a20'/%3E%3Crect x='6' y='6' width='52' height='52' rx='11' fill='none' stroke='%232c3d5e' stroke-width='3'/%3E%3Cpath d='M17 33l10 10 20-22' fill='none' stroke='%236f9ceb' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Interview Prep Tracker</title>
<style>
/* Interview Prep Tracker — рабочий инструмент, не лендинг.
   Плотная типографика, тёмная тема по умолчанию, минимум движения. */

:root {
  --bg:        #14161a;
  --bg-elev:   #1b1e24;
  --bg-sunk:   #101216;
  --bg-hover:  #232830;
  --border:    #2b313b;
  --border-str:#3a424f;
  --text:      #dfe3ea;
  --text-dim:  #9aa3b2;
  --text-faint:#6b7484;
  --accent:    #6f9ceb;
  --accent-dim:#2c3d5e;
  --red:       #c8656a;
  --red-bg:    #3a2427;
  --yellow:    #cfa050;
  --yellow-bg: #3a3020;
  --green:     #6faa78;
  --green-bg:  #223026;
  --hot:       #d08a4a;
  --shadow:    0 6px 24px rgba(0,0,0,.45);

  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --dur: 140ms;
  --sidebar: 216px;
}

:root[data-theme="light"] {
  --bg:        #f4f5f7;
  --bg-elev:   #ffffff;
  --bg-sunk:   #e9ebef;
  --bg-hover:  #eceef2;
  --border:    #d8dce3;
  --border-str:#bcc3cd;
  --text:      #1d2229;
  --text-dim:  #5a6472;
  --text-faint:#8a93a1;
  --accent:    #2f61b8;
  --accent-dim:#d6e1f6;
  --red:       #ab4a50;
  --red-bg:    #f7e3e4;
  --yellow:    #8a6410;
  --yellow-bg: #f8eed6;
  --green:     #3f7d4c;
  --green-bg:  #e0efe3;
  --hot:       #a75f19;
  --shadow:    0 6px 24px rgba(30,40,60,.14);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

code, .mono { font-family: var(--mono); font-size: .88em; }
code {
  background: var(--bg-sunk);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: .05em .3em;
  word-break: break-word;
}
strong { font-weight: 650; }
em { font-style: italic; color: var(--text-dim); }
mark { background: var(--yellow-bg); color: var(--text); border-radius: 2px; padding: 0 .1em; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ── каркас ───────────────────────────────────────────────────────────── */

#app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar);
  flex: 0 0 var(--sidebar);
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  padding: 14px 10px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 2px;
}
.brand {
  font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); padding: 2px 8px 12px;
}
.navbtn {
  display: flex; align-items: center; gap: 9px;
  background: none; border: 0; border-radius: 6px;
  padding: 8px 10px; text-align: left; width: 100%;
  color: var(--text-dim); font-size: 14px;
  transition: background var(--dur), color var(--dur);
}
.navbtn:hover { background: var(--bg-hover); color: var(--text); }
.navbtn[aria-current="true"] { background: var(--accent-dim); color: var(--text); font-weight: 600; }
.navbtn .ic { width: 18px; text-align: center; flex: 0 0 18px; }
.navbtn .badge {
  margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums;
  background: var(--red-bg); color: var(--red); border-radius: 9px; padding: 1px 6px; font-weight: 700;
}
.sidefoot { margin-top: auto; padding: 8px; font-size: 11px; color: var(--text-faint); line-height: 1.4; }

main { flex: 1 1 auto; min-width: 0; padding: 20px 24px 96px; max-width: 1080px; }

.bottomnav { display: none; }

/* ── общие блоки ──────────────────────────────────────────────────────── */

h1.page { font-size: 19px; margin: 0 0 4px; font-weight: 660; letter-spacing: -.01em; }
.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.card.tight { padding: 10px 12px; }

.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.small { font-size: 12.5px; }
.nums { font-variant-numeric: tabular-nums; }

.btn {
  background: var(--bg-sunk); border: 1px solid var(--border-str);
  border-radius: 6px; padding: 6px 12px; font-size: 13px;
  transition: background var(--dur), border-color var(--dur);
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--text); font-weight: 600; }
.btn.danger:hover { border-color: var(--red); color: var(--red); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 3px 8px; font-size: 12px; }

.seg { display: inline-flex; border: 1px solid var(--border-str); border-radius: 7px; overflow: hidden; }
.seg button {
  background: var(--bg-sunk); border: 0; padding: 6px 14px; font-size: 13px;
  color: var(--text-dim); border-right: 1px solid var(--border);
  transition: background var(--dur), color var(--dur);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-dim); color: var(--text); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--bg-hover); }

.pill {
  display: inline-block; font-size: 11px; font-weight: 650; letter-spacing: .04em;
  padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border-str);
  color: var(--text-dim); background: var(--bg-sunk); white-space: nowrap;
}
.pill.hot { color: var(--hot); border-color: var(--hot); background: transparent; }
.pill.red { color: var(--red); border-color: var(--red); }
.pill.green { color: var(--green); border-color: var(--green); }
.pill.kill { color: var(--yellow); border-color: var(--yellow); background: transparent; }

/* прогресс */
.bar { height: 6px; background: var(--bg-sunk); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width var(--dur) linear; }
.bar.done > i { background: var(--green); }

/* ── день ─────────────────────────────────────────────────────────────── */

.dayhead { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.dayhead h2 { font-size: 17px; margin: 2px 0 0; font-weight: 640; }
.daymeta { font-size: 12.5px; color: var(--text-dim); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.navday { display: flex; gap: 6px; }
.navday button { width: 30px; padding: 6px 0; text-align: center; }

.prose {
  border-left: 2px solid var(--border-str); padding: 2px 0 2px 11px;
  color: var(--text-dim); font-size: 13.5px; margin: 10px 0 0; white-space: pre-line;
}

.tier { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 10px; background: var(--bg-elev); }
.tier.dim { opacity: .5; }
.tier.dim:hover { opacity: .8; }
.tierhead {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: none; border: 0; padding: 10px 14px; font-size: 13px; font-weight: 640;
  color: var(--text-dim); border-radius: 9px;
}
.tierhead .lvl { color: var(--text); font-variant-numeric: tabular-nums; }
.tierhead .cnt { margin-left: auto; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.tierhead .caret { transition: transform var(--dur); display: inline-block; font-size: 10px; color: var(--text-faint); }
.tier.open .tierhead .caret { transform: rotate(90deg); }
.tierbody { padding: 0 12px 8px; }
.tier:not(.open) .tierbody { display: none; }

/* повторение вчерашней темы: тот же блок, но приглушённый — он про вчера, а не про сегодня */
.tier.review { border-style: dashed; background: none; }
.tier.review .lvl { color: var(--text-dim); }
.item.rev { align-items: flex-start; }
.item.rev .itext { color: var(--text-dim); font-size: 13px; }
.item.rev .ic-type { font-size: 13px; }

/* строка пункта */
.item {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 6px 6px; border-radius: 6px; border-top: 1px solid var(--border);
}
.tierbody .item:first-child { border-top: 0; }
.item:hover { background: var(--bg-hover); }
.item.is-done .itext { color: var(--text-faint); }
.item.is-done .itext strong { font-weight: 500; }
/* подсветка найденного: анимация — только 150 мс проявления и угасания,
   между ними класс просто держится (удержание состояния, а не движение) */
.item.flash { background: var(--accent-dim); transition: background 150ms ease-out; }

.chk {
  flex: 0 0 auto; margin-top: 2px; width: 17px; height: 17px; border-radius: 4px;
  border: 1.5px solid var(--border-str); background: var(--bg-sunk);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; color: transparent; padding: 0;
  transition: background var(--dur), border-color var(--dur);
}
.chk[aria-pressed="true"] { background: var(--green-bg); border-color: var(--green); color: var(--green); }

.ic-type { flex: 0 0 auto; width: 17px; text-align: center; font-size: 13px; margin-top: 1px; }
.ic-type.stars { width: 27px; font-size: 11px; }

/* поля правки отметки времени на закрытом дне — компактнее, чем в «Настройках» */
.stampin { padding: 4px 7px; font-size: 12.5px; }
/* сдвиг таймера и подпись под ним */
.tshift button { font-variant-numeric: tabular-nums; }
.thint { font-size: 11.5px; color: var(--text-faint); text-align: center; margin: -2px 0 8px; }

.itext { flex: 1 1 auto; min-width: 0; font-size: 14px; word-wrap: break-word; }
.qnum { color: var(--text-faint); font-variant-numeric: tabular-nums; margin: 0 5px 0 2px; font-size: 12.5px; }
.inote { display: block; font-size: 12.5px; color: var(--text-faint); font-style: italic; margin-top: 1px; }
.subs { list-style: none; margin: 5px 0 0; padding: 0 0 0 4px; }
.subs li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; font-size: 13.5px; color: var(--text-dim); }
.subs li::before { content: "–"; color: var(--text-faint); flex: 0 0 auto; }

.confs { flex: 0 0 auto; display: flex; gap: 3px; margin-top: 1px; }
.conf {
  width: 22px; height: 20px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--bg-sunk); padding: 0; font-size: 10px; line-height: 1;
  opacity: .42; transition: opacity var(--dur), background var(--dur), border-color var(--dur);
}
.conf:hover { opacity: .85; }
.conf[aria-pressed="true"] { opacity: 1; }
.conf.r[aria-pressed="true"] { background: var(--red-bg); border-color: var(--red); }
.conf.y[aria-pressed="true"] { background: var(--yellow-bg); border-color: var(--yellow); }
.conf.g[aria-pressed="true"] { background: var(--green-bg); border-color: var(--green); }
.tbtn {
  flex: 0 0 auto; margin-top: 1px; border: 1px solid var(--border-str); background: var(--bg-sunk);
  border-radius: 5px; padding: 1px 7px; font-size: 11px; color: var(--text-dim); white-space: nowrap;
}
.tbtn:hover { border-color: var(--accent); color: var(--text); }

.framework { border-color: var(--accent-dim); }
.framework ol { margin: 6px 0 0; padding-left: 20px; font-size: 13.5px; color: var(--text-dim); }
.framework li { margin-bottom: 3px; }
.framework li strong { color: var(--text); }

.summary { border-color: var(--green); background: var(--green-bg); }

/* ── программа ────────────────────────────────────────────────────────── */

.week { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; background: var(--bg-elev); overflow: hidden; }
.week.current { border-color: var(--accent); }
.weekhead { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 11px 14px; text-align: left; }
.weekhead:hover { background: var(--bg-hover); }
.wtitle { font-size: 14.5px; font-weight: 620; }
.wmeta { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
.wrisk { font-size: 12px; color: var(--red); margin-top: 2px; }
.ring { flex: 0 0 auto; width: 38px; height: 38px; }
.ring text { font-size: 11px; fill: var(--text-dim); font-family: var(--sans); }
.weekbody { padding: 0 10px 10px; }
.week:not(.open) .weekbody { display: none; }
.dayrow {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: 0; border-top: 1px solid var(--border);
  padding: 8px 8px; text-align: left; border-radius: 5px;
}
.dayrow:hover { background: var(--bg-hover); }
.dayrow .wd { flex: 0 0 76px; font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.dayrow .dt { flex: 1 1 auto; font-size: 13.5px; min-width: 0; }
.dayrow .bar { flex: 0 0 74px; }
.dayrow .pc { flex: 0 0 40px; text-align: right; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.dayrow.today { background: var(--accent-dim); }

/* ── красная зона / поиск ─────────────────────────────────────────────── */

.topicgroup { margin-bottom: 16px; }
.topicgroup h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint);
  margin: 0 0 6px; font-weight: 700;
}
.rzitem { border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: 7px; padding: 9px 11px; margin-bottom: 6px; background: var(--bg-elev); }
.rzitem.y { border-left-color: var(--yellow); }
.rzitem.sk { border-left-color: var(--border-str); }
.rzitem .src { font-size: 12px; color: var(--text-faint); margin-top: 5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }

.searchbox {
  width: 100%; background: var(--bg-elev); border: 1px solid var(--border-str);
  border-radius: 8px; padding: 10px 13px; font-size: 15px; color: var(--text); font-family: var(--sans);
}
.searchbox::placeholder { color: var(--text-faint); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.chip {
  border: 1px solid var(--border-str); background: var(--bg-sunk); color: var(--text-dim);
  border-radius: 12px; padding: 3px 11px; font-size: 12px;
  transition: background var(--dur), color var(--dur);
}
.chip[aria-pressed="true"] { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }

/* ── статистика ───────────────────────────────────────────────────────── */

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.stat { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 9px; padding: 13px 15px; }
.stat .n { font-size: 26px; font-weight: 660; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat .l { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
.wkbar { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.wkbar .lbl { flex: 0 0 92px; font-size: 12.5px; color: var(--text-dim); }
.wkbar .bar { flex: 1 1 auto; }
.wkbar .pc { flex: 0 0 62px; text-align: right; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
.donutwrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
table.tbl th { color: var(--text-faint); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
table.tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.scrollx { overflow-x: auto; }

/* ── настройки ────────────────────────────────────────────────────────── */

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
input[type="date"], input[type="number"], input[type="time"], select {
  background: var(--bg-sunk); border: 1px solid var(--border-str); color: var(--text);
  border-radius: 6px; padding: 7px 10px; font-family: var(--sans); font-size: 14px;
}
select { max-width: 100%; }
.hint { font-size: 12.5px; color: var(--text-faint); margin-top: 6px; line-height: 1.45; }
.warn { border-left: 3px solid var(--yellow); padding-left: 10px; }

/* ── таймер ───────────────────────────────────────────────────────────── */

.fab {
  position: fixed; right: 18px; bottom: 18px; z-index: 40;
  background: var(--bg-elev); border: 1px solid var(--border-str); box-shadow: var(--shadow);
  border-radius: 24px; padding: 9px 15px; font-size: 14px; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 7px;
}
.fab.running { border-color: var(--accent); color: var(--accent); }
.fab.over { border-color: var(--green); color: var(--green); }

.tpanel {
  position: fixed; right: 18px; bottom: 66px; z-index: 41; width: 258px;
  background: var(--bg-elev); border: 1px solid var(--border-str); border-radius: 11px;
  box-shadow: var(--shadow); padding: 14px;
}
.tpanel[hidden] { display: none; }
.tdisplay { font-size: 36px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin: 2px 0 4px; }
.tlabel { text-align: center; font-size: 12px; color: var(--text-faint); margin-bottom: 10px; min-height: 16px; }
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 9px; }
.presets button { padding: 5px 0; font-size: 12px; border: 1px solid var(--border); background: var(--bg-sunk); border-radius: 5px; }
.presets button:hover { background: var(--bg-hover); }
.tctl { display: flex; gap: 6px; }
.tctl .btn { flex: 1 1 auto; text-align: center; }
.tcustom { display: flex; gap: 6px; margin-top: 9px; }
.tcustom input { flex: 1 1 auto; width: 100%; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 60;
  background: var(--bg-elev); border: 1px solid var(--border-str); box-shadow: var(--shadow);
  border-radius: 8px; padding: 9px 16px; font-size: 13.5px; max-width: 90vw;
}
.toast[hidden] { display: none; }

/* ── адаптив: телефон от 360px ────────────────────────────────────────── */

@media (max-width: 780px) {
  body { font-size: 15px; }
  #app { display: block; }
  .sidebar { display: none; }
  main { padding: 14px 12px 88px; max-width: none; }

  .bottomnav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--bg-elev); border-top: 1px solid var(--border);
    padding: 4px 2px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  .bottomnav .navbtn {
    flex: 1 1 0; min-width: 0; flex-direction: column; gap: 2px; padding: 5px 1px;
    font-size: 10px; text-align: center; align-items: center; border-radius: 5px;
  }
  .bottomnav .navbtn .ic { font-size: 15px; }
  .bottomnav .navbtn .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .bottomnav .navbtn .badge { position: absolute; margin: 0; }
  .bottomnav .navbtn { position: relative; }
  .bottomnav .navbtn .badge { top: 1px; right: 50%; margin-right: -20px; }

  .fab { bottom: 62px; right: 12px; padding: 8px 13px; }
  .tpanel { bottom: 108px; right: 12px; left: 12px; width: auto; }

  .card { padding: 12px; }
  .dayrow .wd { flex: 0 0 66px; font-size: 12px; }
  .dayrow .bar { flex: 0 0 48px; }
  .dayrow .pc { flex: 0 0 34px; }
  .wkbar .lbl { flex: 0 0 70px; }
  h1.page { font-size: 17px; }
  .itext { font-size: 14px; }
  .presets { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>

rchitecture** — слои, модули, поток данных.","**API contract & data model** — форма пагинации, размер payload, версионирование.","**Caching & sync** — single source of truth, инвалидация, разрешение конфликтов.","**Threading** — что где выполняется, что отменяемо.","**Edge cases** — нет сети, медленная сеть, process death, частичный отказ, расхождение часов.","**Observability** — метрики, логи, крашлитика, на что алертить.","**Testing & rollout** — как безопасно выкатить.","**Trade-offs** — что сделал бы иначе при 10× нагрузке."],"frameworkTitle":"Каркас ответа — выучить наизусть, проговаривать в этом порядке","frameworkNote":"Заметка по Revolut: в дизайн-раунде ценят операционный workflow больше, чем красивую диаграмму. Не рисуй схему — рассказывай, как это работает в продакшене.","frameworkExtra":"**Реальные формулировки, которые давали кандидатам** (используем как материал для моков в неделях 8–9):\nride-sharing между тремя корпусами кампуса · photo streaming app · Instagram Stories · Slack chat · ranked Instagram feed · Robinhood app · JIRA-подобное приложение для планирования событий · фича, показывающая водителям зоны высокого спроса (сначала API, потом клиент)","risk":"**Отсев на дизайн-раунде**"},{"id":"w7","number":7,"title":"Платформа, производительность, тесты, безопасность","dateRange":"14–20 сентября","days":[{"id":"w7-d1","date":"2026-09-14","srcMonth":9,"srcDay":14,"weekday":"Пн","title":"Жизненный цикл и компоненты","hot":false,"timed":false,"tiers":[{"level":20,"items":[{"id":"w7-d1-t1-01","type":"question","text":"Walk through the full Activity lifecycle on rotation. What changes with `android:configChanges`?","number":1},{"id":"w7-d1-t1-02","type":"question","text":"Process death vs configuration change — how do they differ, and how do you actually test process death?","number":2},{"id":"w7-d1-t1-03","type":"question","text":"`onSaveInstanceState` vs `SavedStateHandle` vs `ViewModel` — what survives what?","number":3},{"id":"w7-d1-t1-04","type":"q ,"index":64,"topic":"Моки и прогоны"}],"risk":"Готов, но не начал искать"}],"intro":"# Программа подготовки к собеседованиям — 1 августа … 4 октября 2026\n**Один документ. Все вопросы внутри. Больше ничего открывать не нужно.**\nОсновной трек — европейский финтех (Revolut, Monzo, N26, Wise). Алгоритмы идут фоном.","rhythm":"**Ритм недели:** Пн–Чт теория · Пт код · Сб большой блок · Вс behavioral + английский.","outro":"**63 дня.** Проверенный состав:\nДубли между §14 и Ч2 E схлопнуты. **Оба банка перенесены полностью — ничего не потеряно.**\nЕсли за неделю выходит меньше трёх дней — не растягивай план, а урезай. Первыми выкидываются Gradle/CI и алгоритмы: для европейского финтеха они наименее критичны."};
var TRACK_DATA = {"core":{"id":"core","title":"Ядро","start":"2026-08-01","weeks":[{"id":"b1","number":1,"title":"Concurrency & Thread Safety","dateRange":"","days":[{"id":"b1-d1","date":null,"index":0,"weekday":"","title":"Concurrency & Thread Safety","hot":false,"timed":false,"topic":"Concurrency & Thread Safety","tiers":[{"level":20,"items":[{"id":"b1-q005","type":"question","text":"`synchronized` vs `ReentrantLock` vs `Mutex` — trade-offs, and why you cannot use `synchronized` around a suspend call.","number":"1.5","priority":"kill"},{"id":"b1-q001","type":"question","text":"Define race condition, data race, deadlock, livelock and starvation. Give a concrete example of each.","number":"1.1","priority":"kill"},{"id":"b1-q002","type":"question","text":"Two parallel requests withdraw money from the same account at the same time. Walk me through the race and fix it. *(прямая формулировка из отчётов о Revolut)*","number":"1.2","priority":"kill"},{"id":"b1-q003","type":"question","text":"What does `@Volatile` guarantee — and what does it explicitly NOT guarantee?","number":"1.3","priority":"kill"},{"id":"b1-q004","type":"question","text":"What is the happens-before relationship in the JMM? Give an example using `volatile`.","number":"1.4","priority":"kill"},{"id":"b1-q006","type":"question","text":"How do you prevent deadlock in `transfer(from, to, amount)` between two accounts? *(lock ordering — проговори явно)*","number":"1.6","priority":"kill"},{"id":"b1-q007","type":"question","text":"Optimistic vs pessimistic locking — model an account transfer with both. Which would you ship in a bank and why?","number":"1.7","priority":"kill"},{"id":"b1-q008","type":"question","text":"What is CAS? How do `AtomicInteger` / `AtomicReference` use it, and when does CAS perform badly?","number":"1.8","priority":"kill"},{"id":"b1-q009","type":"question","text":"Explain double-checked locking and why `volatile` is required for correctness.","number":"1.9","priority":"kill"},{"id":"b1-q010","type":"question","text":"`ConcurrentHashMap` vs `Collections.synchronizedMap` — what is actually different?","number":"1.10","priority":"high"},{"id":"b1-q011","type":"question","text":"Why are unbounded thread pools dangerous? How do you size a pool for CPU-bound vs IO-bound work?","number":"1.11","priority":"high"},{"id":"b1-q012","type":"question","text":"Explain the Android main thread machinery: `Looper`, `MessageQueue`, `Handler`, `Choreographer`.","number":"1.12","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"**Почему первый.** Это документированный фильтр Revolut. В отзывах кандидатов и в гайдах по процессу конкурентность названа отдельно как то, на чём отсеивают Java/Kotlin-кандидатов. У Monzo в system design грилят по concurrency / consistency / network faults. Ни один другой блок не даёт такой плотности отказов.\nУчить **до автоматизма** — не «знаю определение», а «пишу корректный код под таймером и вслух объясняю, почему он корректен»."}]},{"id":"b2","number":2,"title":"Live Coding / LLD","dateRange":"","days":[{"id":"b2-d1","date":null,"index":0,"weekday":"","title":"Live Coding / LLD","hot":false,"timed":false,"topic":"Live Coding / LLD","tiers":[{"level":20,"items":[{"id":"b2-q001","type":"question","text":"**Thread-safe in-memory account ledger**: `deposit`, `withdraw`, `transfer`. No deadlocks. With unit tests.","number":"2.1","priority":"kill"},{"id":"b2-q002","type":"question","text":"**In-memory load balancer** with pluggable strategies (round-robin, weighted, least-connections) + register/unregister. Thread-safe.","number":"2.2","priority":"kill"},{"id":"b2-q003","type":"question","text":"**Rate limiter** — implement fixed window, then sliding window, then token bucket. Thread-safe. *(named by Monzo candidates too)*","number":"2.3","priority":"kill"},{"id":"b2-q004","type":"question","text":"**Currency conversion engine**: rate table, cross-rates, stale-rate handling.","number":"2.4","priority":"kill"},{"id":"b2-q005","type":"question","text":"**LRU cache with TTL**, O(1), thread-safe.","number":"2.5","priority":"kill"},{"id":"b2-q006","type":"question","text":"**Request deduplication cache**: same key → one in-flight call, all callers receive the result.","number":"2.6","priority":"kill"},{"id":"b2-q007","type":"question","text":"**Fix a broken app.** You inherit a half-finished screen with crashes, a memory leak and unfinished design. Get it to spec inside the timebox, narrating trade-offs. *(буквально описанный сценарий Monzo take-home)*","number":"2.7","priority":"kill"},{"id":"b2-q008","type":"question","text":"**Retry executor** with exponential backoff, jitter and cancellation.","number":"2.8","priority":"high"},{"id":"b2-q009","type":"question","text":"**Task scheduler** running at most N tasks concurrently, preserving submission order per key.","number":"2.9","priority":"high"},{"id":"b2-q010","type":"question","text":"Convert a callback-based repository to coroutines **without breaking existing callers**.","number":"2.10","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"**Формат раунда:** 45–60 минут, 2–3 задачи подряд, свой IDE, часто без Copilot и без поиска. Требования: **работающий код + юнит-тесты + thread safety by default + SOLID**. Главная причина провала — кандидаты относятся к раунду как к спортивному программированию вместо инженерной задачи. Take-home без тестов у Revolut описывается как автоматический отказ.\n**Тренируй с таймером и вслух.** Работающее решение с тестами бьёт элегантное без тестов."}],"note":"**Правило для 2.7 и 2.10.** Monzo прямо просит уложиться в таймбокс и показать осознанные компромиссы, а не идеальное решение за выходные. На разборе решения нужно **защищать ключевые решения** и честно говорить, что сделал бы иначе при большем времени. Готовь эту формулировку заранее."},{"id":"b3","number":3,"title":"Coroutines & Flow","dateRange":"","days":[{"id":"b3-d1","date":null,"index":0,"weekday":"","title":"Coroutines & Flow","hot":false,"timed":false,"topic":"Coroutines & Flow","tiers":[{"level":20,"items":[{"id":"b3-q002","type":"question","text":"What is structured concurrency and what concrete problems does it eliminate?","number":"3.2","priority":"kill"},{"id":"b3-q003","type":"question","text":"`launch` vs `async` vs `withContext` — return type, exception behaviour, dispatch.","number":"3.3","priority":"kill"},{"id":"b3-q004","type":"question","text":"`Job` vs `SupervisorJob`; `coroutineScope {}` vs `supervisorScope {}` — how does exception propagation differ?","number":"3.4","priority":"kill"},{"id":"b3-q005","type":"question","text":"Why is cancellation cooperative, and what does that mean for your code?","number":"3.5","priority":"kill"},{"id":"b3-q012","type":"question","text":"Cold vs hot: `Flow`, `SharedFlow`, `StateFlow`, `Channel` — compare semantics.","number":"3.12","priority":"kill"},{"id":"b3-q013","type":"question","text":"What exactly does `SharingStarted.WhileSubscribed(5_000)` do, and why 5 seconds?","number":"3.13","priority":"kill"},{"id":"b3-q020","type":"question","text":"`Mutex` vs `synchronized` — and how do you deduplicate in-flight requests so five simultaneous callers trigger one network call?","number":"3.20","priority":"kill"},{"id":"b3-q023","type":"question","text":"A network call is in flight when `onCleared()` is called. What happens to the coroutine? To the HTTP request? To the OkHttp thread?","number":"3.23","priority":"kill"},{"id":"b3-q024","type":"question","text":"Why doesn't `try { launch { throw ... } } catch (e: Exception) {}` catch anything?","number":"3.24","priority":"kill"},{"id":"b3-q025","type":"question","text":"`async {}` throws and you never call `await()`. Where does the exception go?","number":"3.25","priority":"kill"},{"id":"b3-q026","type":"question","text":"A parent is cancelled while a child is inside a `finally` block that calls a suspend function. What happens?","number":"3.26","priority":"kill"},{"id":"b3-q027","type":"question","text":"Name three concrete production failures caused by `GlobalScope.launch` inside a ViewModel.","number":"3.27","priority":"kill"},{"id":"b3-q028","type":"question","text":"Does marking a function `suspend` guarantee it won't block the main thread?","number":"3.28","priority":"kill"},{"id":"b3-q029","type":"question","text":"`while (true) { doWork() }` inside a coroutine — is it cancellable? How do you fix it?","number":"3.29","priority":"kill"},{"id":"b3-q030","type":"question","text":"`MutableStateFlow` is assigned an equal value twice. How many emissions do collectors see? Why?","number":"3.30","priority":"kill"},{"id":"b3-q031","type":"question","text":"`_state.value.items.add(newItem)` where `items` is a `MutableList` — does the UI update? Why not?","number":"3.31","priority":"kill"},{"id":"b3-q032","type":"question","text":"A navigation event is emitted into a `SharedFlow(replay = 0)` before the screen subscribes. What happens, and how do you fix it *properly*?","number":"3.32","priority":"kill"},{"id":"b3-q033","type":"question","text":"Two collectors subscribe to the same cold `Flow` from a Retrofit call. How many network requests fire?","number":"3.33","priority":"kill"},{"id":"b3-q034","type":"question","text":"An exception is thrown inside `collect {}`. Is upstream cancelled? Does `catch {}` intercept it? What changes if `catch {}` is placed before vs after `map {}`?","number":"3.34","priority":"kill"},{"id":"b3-q035","type":"question","text":"`stateIn` requires an initial value. What are the two standard ways to model \"nothing loaded yet\", and what's wrong with `null`?","number":"3.35","priority":"kill"},{"id":"b3-q036","type":"question","text":"Why is `StateFlow` a poor fit for one-off events (navigation, snackbar)? Walk through `Channel` vs `SharedFlow` vs state-driven event, and the lifecycle race in each. *(живой спор в комьюнити — сильный ответ обязателен для senior)*","number":"3.36","priority":"kill"},{"id":"b3-q001","type":"question","text":"What is a coroutine at the bytecode level? Explain CPS transformation and `Continuation`.","number":"3.1","priority":"high"},{"id":"b3-q006","type":"question","text":"How do you make a blocking third-party call cancellable?","number":"3.6","priority":"high"},{"id":"b3-q007","type":"question","text":"How does `CoroutineExceptionHandler` work, and why doesn't it catch exceptions from `async`?","number":"3.7","priority":"high"},{"id":"b3-q008","type":"question","text":"`Main` vs `Main.immediate` vs `Default` vs `IO` — thread pools, sizing, use cases. What problem does `limitedParallelism` solve?","number":"3.8","priority":"high"},{"id":"b3-q009","type":"question","text":"What does \"main-safe suspend function\" mean, and whose responsibility is main-safety?","number":"3.9","priority":"high"},{"id":"b3-q010","type":"question","text":"How do you inject dispatchers so the code stays testable?","number":"3.10","priority":"high"},{"id":"b3-q011","type":"question","text":"`runBlocking` vs `runTest`; how does `runTest` handle virtual time and delay skipping?","number":"3.11","priority":"high"},{"id":"b3-q014","type":"question","text":"`map` vs `flatMapLatest` vs `flatMapMerge` vs `flatMapConcat` — a real use case for each.","number":"3.14","priority":"high"},{"id":"b3-q015","type":"question","text":"`combine` vs `zip` — behaviour with different emission rates.","number":"3.15","priority":"high"},{"id":"b3-q016","type":"question","text":"`collect` vs `collectLatest` — what exactly gets cancelled?","number":"3.16","priority":"high"},{"id":"b3-q017","type":"question","text":"What does `flowOn` change, and why does it only affect upstream operators?","number":"3.17","priority":"high"},{"id":"b3-q018","type":"question","text":"How do `callbackFlow` and `channelFlow` work, and why is `awaitClose` mandatory?","number":"3.18","priority":"high"},{"id":"b3-q019","type":"question","text":"Wrap a callback-based API in `suspendCancellableCoroutine`. What must you handle?","number":"3.19","priority":"high"},{"id":"b3-q021","type":"question","text":"`repeatOnLifecycle` vs `flowWithLifecycle` vs `launchWhenStarted` — what is deprecated and why?","number":"3.21","priority":"high"},{"id":"b3-q022","type":"question","text":"How do you test a Flow? Show the Turbine approach for a `SharedFlow`.","number":"3.22","priority":"high"},{"id":"b3-q037","type":"question","text":"You're already on `Dispatchers.IO` and call `withContext(Dispatchers.IO)`. Does a thread switch happen?","number":"3.37","priority":"high"},{"id":"b3-q038","type":"question","text":"`Dispatchers.IO` and `Dispatchers.Default` share threads. What does that imply for a CPU-heavy task launched on IO?","number":"3.38","priority":"high"},{"id":"b3-q039","type":"question","text":"`WhileSubscribed(5000)` vs `Eagerly` vs `Lazily` — what does the user actually see on rotation for each?","number":"3.39","priority":"high"},{"id":"b3-q040","type":"question","text":"`.flowOn(Dispatchers.IO)` placed after `.collect {}` — does it do anything? And `combine(a, b)` where `b` hasn't emitted yet — does downstream receive anything?","number":"3.40","priority":"high"},{"id":"b3-q041","type":"question","text":"`distinctUntilChanged()` on a data class holding a `List` — does it reliably deduplicate?","number":"3.41","priority":"high"},{"id":"b3-q042","type":"question","text":"`lifecycleScope.launch { flow.collect {} }` in `onCreate` — what exactly leaks, and when?","number":"3.42","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"**Самый вероятный технический deep-dive для Android-роли** и одновременно топливо для блока 1. Разделено на теорию и gotcha-вопросы — вторые ценнее, там сеньоры и валятся."}],"note":"Формат: тебе дают сниппет и спрашивают «что выведется» / «что здесь баг». Это **самый ценный подраздел всего файла**: тут ты «знаешь тему», но отвечаешь неправильно."},{"id":"b4","number":4,"title":"Защита своей архитектуры (раунд по ABM)","dateRange":"","days":[{"id":"b4-d1","date":null,"index":0,"weekday":"","title":"Защита своей архитектуры (раунд по ABM)","hot":false,"timed":false,"topic":"Защита своей архитектуры (раунд по ABM)","tiers":[{"level":20,"items":[{"id":"b4-q001","type":"question","text":"Walk me through the architecture of the app you work on. *(3 минуты, без бумажки, на английском)*","number":"4.1","priority":"kill"},{"id":"b4-q002","type":"question","text":"Why is it structured that way? What would you change if you started today?","number":"4.2","priority":"kill"},{"id":"b4-q003","type":"question","text":"**Someone looking at your app might say it's over-engineered. What would you say to that?** *(реально задавали на Monzo — это не троллинг, это проверка, умеешь ли обосновывать, а не оправдываться)*","number":"4.3","priority":"kill"},{"id":"b4-q004","type":"question","text":"How many modules do you have, what is the actual build time, and what have you done about it?","number":"4.4","priority":"kill"},{"id":"b4-q005","type":"question","text":"Which part of the codebase are you least happy with, and why haven't you fixed it?","number":"4.5","priority":"kill"},{"id":"b4-q006","type":"question","text":"What's your test strategy, honestly — what is tested and what isn't?","number":"4.6","priority":"kill"},{"id":"b4-q007","type":"question","text":"What's the hardest bug you've debugged there? Walk me through the investigation.","number":"4.7","priority":"kill"},{"id":"b4-q008","type":"question","text":"Tell me about a big technical challenge you overcame, and how you influenced stakeholders around it. *(дословно то, что Monzo указывает как содержание первого звонка)*","number":"4.8","priority":"kill"},{"id":"b4-q009","type":"question","text":"How do you handle a feature that touches four teams' modules?","number":"4.9","priority":"high"},{"id":"b4-q010","type":"question","text":"What does your release process look like, and what's the worst thing that ever shipped?","number":"4.10","priority":"high"},{"id":"b4-q011","type":"question","text":"If I gave you two weeks and no product work, what would you fix first?","number":"4.11","priority":"high"},{"id":"b4-q012","type":"question","text":"How is your app different from a non-banking app — what does the domain force you to do?","number":"4.12","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"**Самый высокий ROI на час подготовки во всём файле.** Это отдельный раунд у Monzo (первый часовой звонок — разбор недавнего сложного проекта, кода не пишешь), у N26 (deep dive, где два senior-инженера заставляют защищать каждое решение), у Wise (разбор take-home). Ты уже знаешь материал — нужно только отрепетировать формулировки на английском.\n**Заготовь три истории по ABM**, каждая на 3 минуты, каждая с цифрами:\n1. Сложная фича с trade-offs.\n2. Инцидент/баг с расследованием.\n3. Архитектурное решение, которое продавил — или проиграл."}]},{"id":"b5","number":5,"title":"Architecture & Modularization","dateRange":"","days":[{"id":"b5-d1","date":null,"index":0,"weekday":"","title":"Architecture & Modularization","hot":false,"timed":false,"topic":"Architecture & Modularization","tiers":[{"level":20,"items":[{"id":"b5-q001","type":"question","text":"Single state class vs multiple flows for a screen — defend your choice. *(N26 отклонял take-home именно за отдельные потоки под error / loading / result)*","number":"5.1","priority":"kill"},{"id":"b5-q002","type":"question","text":"How do you model loading / error / empty / content without a combinatorial explosion of states?","number":"5.2","priority":"kill"},{"id":"b5-q003","type":"question","text":"MVVM vs MVI vs MVP — what do you actually gain from MVI, and what does it cost?","number":"5.3","priority":"kill"},{"id":"b5-q004","type":"question","text":"Clean Architecture: what belongs in the domain layer? When is a UseCase layer just ceremony?","number":"5.4","priority":"high"},{"id":"b5-q005","type":"question","text":"Where do you map DTO → entity → domain → UI models, and why there?","number":"5.5","priority":"high"},{"id":"b5-q006","type":"question","text":"What problem does an `api`/`impl` module split solve, and how do you wire it with Hilt?","number":"5.6","priority":"high"},{"id":"b5-q007","type":"question","text":"How do you enforce module dependency rules mechanically rather than at code review?","number":"5.7","priority":"high"},{"id":"b5-q008","type":"question","text":"Hilt components and scopes, `@Binds` vs `@Provides`, multibindings — how do you provide a feature-scoped dependency?","number":"5.8","priority":"high"},{"id":"b5-q009","type":"question","text":"How do you structure navigation in a multi-module app so features don't depend on each other?","number":"5.9","priority":"high"},{"id":"b5-q010","type":"question","text":"How do you evolve a public module API without breaking 30 consumers?","number":"5.10","priority":"high"},{"id":"b5-q011","type":"question","text":"How would you incrementally migrate a legacy XML/MVP app to Compose/MVI without freezing the roadmap?","number":"5.11","priority":"high"},{"id":"b5-q012","type":"question","text":"How do you architect for feature flags, and how do you avoid flag debt?","number":"5.12","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Твоя домашняя территория (ABM: multi-module, MVI, Hilt, api/impl, convention plugins). Держи ⭐⭐ там, где N26 реально резал кандидатов."}]},{"id":"b6","number":6,"title":"Mobile System Design","dateRange":"","days":[{"id":"b6-d1","date":null,"index":0,"weekday":"","title":"Mobile System Design","hot":false,"timed":false,"topic":"Mobile System Design","tiers":[{"level":20,"items":[{"id":"b6-q001","type":"question","text":"Design a transactions/statements screen covering ten years of history.","number":"6.1","priority":"kill"},{"id":"b6-q002","type":"question","text":"Design a money transfer flow, including retries, idempotency and failure states.","number":"6.2","priority":"kill"},{"id":"b6-q003","type":"question","text":"Design an offline-first sync engine: scheduling, backoff, conflicts, battery.","number":"6.3","priority":"kill"},{"id":"b6-q004","type":"question","text":"Design a photo/video upload pipeline that survives process death. *(вариант: KYC onboarding с загрузкой документов и резюмируемыми шагами)*","number":"6.4","priority":"kill"},{"id":"b6-q005","type":"question","text":"Design a chat app with offline support, read receipts and message ordering.","number":"6.5","priority":"kill"},{"id":"b6-q006","type":"question","text":"Design an Instagram-style / ranked feed client.","number":"6.6","priority":"high"},{"id":"b6-q007","type":"question","text":"Design a multi-currency balance screen updating in real time over WebSocket: throttling, ordering, stale data.","number":"6.7","priority":"high"},{"id":"b6-q008","type":"question","text":"Design push notification handling: deduplication, deep links, foreground vs background.","number":"6.8","priority":"high"},{"id":"b6-q009","type":"question","text":"Design a client-side analytics SDK: batching, offline buffering, sampling, privacy.","number":"6.9","priority":"high"},{"id":"b6-q010","type":"question","text":"Design a feature-flag and remote-config client.","number":"6.10","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"**Отдельный раунд у Monzo** (час, два мобильных инженера, виртуальная доска Excalidraw, кода не пишешь кроме моделей данных и интерфейсов). Тебе дают **UI-дизайн + начальные требования** и просят blueprint end-to-end реализации — такой, чтобы по нему можно было начать писать вместе. Оценивают: удержание общего понимания с интервьюером и проактивное снятие неоднозначности. У N26 и Bolt тоже отдельный system design раунд.\n**Важно:** в отчётах по Revolut отмечают, что в system design ценили **операционный workflow больше, чем красивую общую диаграмму**. Не рисуй схему — рассказывай, как это работает в проде. И почти всегда просят **и клиент, и контракт API** — не застревай в Android-слое."}],"framework":["**Clarify scope** — одна фича или всё приложение? Платформы? Офлайн нужен? Real-time или pull-to-refresh?","**Non-functional requirements** — latency, офлайн, батарея, память, безопасность, доступность, локализация.","**High-level client architecture** — слои, модули, поток данных.","**API contract & data model** — форма пагинации, размер payload, версионирование.","**Caching & sync** — single source of truth, инвалидация, разрешение конфликтов.","**Threading & concurrency** — что где выполняется, что отменяемо.","**Edge cases & failure modes** — нет сети, медленная сеть, process death, частичный отказ, clock skew.","**Observability** — метрики, логи, crash reporting, на что бы алертил.","**Testing & rollout** — как безопасно выкатить.","**Trade-offs и что сделал бы иначе на 10× масштабе.**"],"frameworkTitle":"Каркас ответа"},{"id":"b7","number":7,"title":"Data, Networking & Offline","dateRange":"","days":[{"id":"b7-d1","date":null,"index":0,"weekday":"","title":"Data, Networking & Offline","hot":false,"timed":false,"topic":"Data, Networking & Offline","tiers":[{"level":20,"items":[{"id":"b7-q001","type":"question","text":"What is idempotency, and why does a payment request need an idempotency key?","number":"7.1","priority":"kill"},{"id":"b7-q002","type":"question","text":"How do you guarantee a \"send money\" action executes exactly once from the client's point of view?","number":"7.2","priority":"kill"},{"id":"b7-q003","type":"question","text":"Implement token refresh when five parallel requests all return 401 simultaneously.","number":"7.3","priority":"kill"},{"id":"b7-q004","type":"question","text":"Conflict resolution: last-write-wins, version vectors, server authority — which fits a bank and why?","number":"7.4","priority":"kill"},{"id":"b7-q005","type":"question","text":"Design optimistic UI with rollback — first for a \"like\", then for a money transfer. What changes?","number":"7.5","priority":"high"},{"id":"b7-q006","type":"question","text":"OkHttp application vs network interceptors — where do auth, retry and logging belong?","number":"7.6","priority":"high"},{"id":"b7-q007","type":"question","text":"How do you map HTTP, network and parsing failures into a single domain error model?","number":"7.7","priority":"high"},{"id":"b7-q008","type":"question","text":"WebSocket vs SSE vs long polling vs FCM push — pick one for live balance updates and justify it.","number":"7.8","priority":"high"},{"id":"b7-q009","type":"question","text":"Cursor-based vs offset pagination — why does it matter for a transactions list?","number":"7.9","priority":"high"},{"id":"b7-q010","type":"question","text":"Room migrations: what happens when one is missing, and how do you test migrations?","number":"7.10","priority":"high"},{"id":"b7-q011","type":"question","text":"Certificate pinning bypasses the device trust store — what is the operational cost, and how do you avoid bricking the app on rotation?","number":"7.11","priority":"high"},{"id":"b7-q012","type":"question","text":"Encrypting local data: SQLCipher, `EncryptedSharedPreferences`, Keystore-backed keys — trade-offs.","number":"7.12","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Это топливо для блока 6. Каждый вопрос отсюда — потенциальный follow-up в system design."}]},{"id":"b8","number":8,"title":"Jetpack Compose","dateRange":"","days":[{"id":"b8-d1","date":null,"index":0,"weekday":"","title":"Jetpack Compose","hot":false,"timed":false,"topic":"Jetpack Compose","tiers":[{"level":20,"items":[{"id":"b8-q001","type":"question","text":"Explain the three phases: composition, layout, drawing. Which phase should you avoid doing work in?","number":"8.1","priority":"kill"},{"id":"b8-q002","type":"question","text":"What is a recompose scope, and why can a whole screen recompose because of one state read?","number":"8.2","priority":"kill"},{"id":"b8-q003","type":"question","text":"**What is strong skipping mode and what changed?** Unstable параметры теперь сравниваются по instance equality (`===`), лямбды с unstable-захватами авто-мемоизируются, а большинство ручных `@Stable`/`@Immutable` стали мёртвым грузом — они нужны только там, где требуется сравнение по `equals()`. Знать это точно: тема свежая, и на ней ловят тех, кто выучил старые правила стабильности.","number":"8.3","priority":"kill"},{"id":"b8-q004","type":"question","text":"How do you diagnose excessive recomposition? (Layout Inspector counts, compiler reports, composition tracing.)","number":"8.4","priority":"kill"},{"id":"b8-q005","type":"question","text":"`@Stable` vs `@Immutable` — what is the contract, and what happens if you lie to the compiler?","number":"8.5","priority":"high"},{"id":"b8-q006","type":"question","text":"`remember` vs `rememberSaveable` — what survives what? How do you write a custom `Saver`?","number":"8.6","priority":"high"},{"id":"b8-q007","type":"question","text":"What problem does `derivedStateOf` solve, and what is the most common misuse? What's the defect if it's written without `remember`?","number":"8.7","priority":"high"},{"id":"b8-q008","type":"question","text":"Give a use case for each: `LaunchedEffect`, `DisposableEffect`, `SideEffect`, `rememberCoroutineScope`, `rememberUpdatedState`, `snapshotFlow`.","number":"8.8","priority":"high"},{"id":"b8-q009","type":"question","text":"`LaunchedEffect(Unit)` sits inside an `if (condition)` branch that toggles. How many times does the effect run?","number":"8.9","priority":"high"},{"id":"b8-q010","type":"question","text":"`rememberCoroutineScope()` vs `LaunchedEffect` — give a case where the wrong one is a bug, not a style choice.","number":"8.10","priority":"high"},{"id":"b8-q011","type":"question","text":"Why do `key`s matter in a `LazyColumn` for state and animation correctness? `mutableStateListOf` vs `mutableStateOf(listOf())`?","number":"8.11","priority":"high"},{"id":"b8-q012","type":"question","text":"`LazyColumn` performance: keys, `contentType`, item stability, nested scrolling pitfalls.","number":"8.12","priority":"high"},{"id":"b8-q013","type":"question","text":"What is a baseline profile, roughly what does it buy you on cold start, and how do you generate one?","number":"8.13","priority":"high"},{"id":"b8-q014","type":"question","text":"State hoisting and UDF — how do you structure a screen with 20 interactive fields without a god-object state?","number":"8.14","priority":"high"},{"id":"b8-q015","type":"question","text":"How does the Navigation Compose back stack work? What does Navigation 3 change conceptually (`NavKey`, `NavDisplay`, `SceneStrategy`, `EntryProvider`)? How do you scope a ViewModel to a nav graph or a single destination?","number":"8.15","priority":"high"},{"id":"b8-q016","type":"question","text":"Edge-to-edge is enforced now — how do you handle window insets, including IME insets, in Compose?","number":"8.16","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Compose — уже не опция, а дефолт; интервьюеры на mid/senior спрашивают про него системно. Но глубина спроса ниже, чем по корутинам: тебя проверяют на понимание **рекомпозиции и стабильности**, а не на знание всех API."}]},{"id":"b9","number":9,"title":"ViewModel, Lifecycle & State","dateRange":"","days":[{"id":"b9-d1","date":null,"index":0,"weekday":"","title":"ViewModel, Lifecycle & State","hot":false,"timed":false,"topic":"ViewModel, Lifecycle & State","tiers":[{"level":20,"items":[{"id":"b9-q001","type":"question","text":"Process death vs configuration change — how do they differ, and how do you *actually* test process death on a device?","number":"9.1","priority":"kill"},{"id":"b9-q002","type":"question","text":"`onSaveInstanceState` vs `SavedStateHandle` vs `ViewModel` — what survives what? What can you put in `SavedStateHandle`, and what's the practical size limit?","number":"9.2","priority":"kill"},{"id":"b9-q003","type":"question","text":"What happens to `viewModelScope` in `onCleared()`, and what does NOT get cancelled?","number":"9.3","priority":"kill"},{"id":"b9-q004","type":"question","text":"Walk through the full Activity lifecycle on rotation. What changes with `android:configChanges`?","number":"9.4","priority":"high"},{"id":"b9-q005","type":"question","text":"What is the practical `Bundle` size limit, and how do you avoid `TransactionTooLargeException`?","number":"9.5","priority":"high"},{"id":"b9-q006","type":"question","text":"Is there ever a safe way for a ViewModel to hold a `Context`? Which `Context` types leak and why?","number":"9.6","priority":"high"},{"id":"b9-q007","type":"question","text":"Passing a screen argument into a ViewModel: assisted injection vs `SavedStateHandle` — when is each correct?","number":"9.7","priority":"high"},{"id":"b9-q008","type":"question","text":"A singleton holds an Activity `Context`. How long does the leak last, and what exactly is retained?","number":"9.8","priority":"high"},{"id":"b9-q009","type":"question","text":"LiveData vs StateFlow for a state holder — argue both sides, then pick one.","number":"9.9","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Плотный gotcha-блок. Спрашивают почти везде, потому что дёшево проверить и хорошо разделяет middle от senior."}]},{"id":"b10","number":10,"title":"Testing","dateRange":"","days":[{"id":"b10-d1","date":null,"index":0,"weekday":"","title":"Testing","hot":false,"timed":false,"topic":"Testing","tiers":[{"level":20,"items":[{"id":"b10-q001","type":"question","text":"In a 60-minute live coding round with TDD, what do you write first and why?","number":"10.1","priority":"kill"},{"id":"b10-q002","type":"question","text":"`StandardTestDispatcher` vs `UnconfinedTestDispatcher`, `advanceUntilIdle`, `runCurrent` — when does each matter?","number":"10.2","priority":"kill"},{"id":"b10-q003","type":"question","text":"How do you make a ViewModel fully unit-testable?","number":"10.3","priority":"kill"},{"id":"b10-q004","type":"question","text":"Mocks verify interactions, stubs return canned responses, fakes are simplified working implementations — when do you use each, and why do seniors lean towards fakes?","number":"10.4","priority":"high"},{"id":"b10-q005","type":"question","text":"How do you test a `SharedFlow` of one-off events with Turbine? And a state holder using `stateIn(WhileSubscribed)`?","number":"10.5","priority":"high"},{"id":"b10-q006","type":"question","text":"Describe your testing pyramid for a banking app, concretely.","number":"10.6","priority":"high"},{"id":"b10-q007","type":"question","text":"What makes UI tests flaky, and what are your five standard fixes?","number":"10.7","priority":"high"},{"id":"b10-q008","type":"question","text":"How do you test logic that depends on time, dates and timezones?","number":"10.8","priority":"high"},{"id":"b10-q009","type":"question","text":"What is your position on code coverage as a target metric?","number":"10.9","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Не факультатив. У Revolut отправка take-home без тестов описывается как автоматический отказ; в live coding ждут юнит-тесты внутри таймбокса."}]},{"id":"b11","number":11,"title":"Performance & Diagnostics","dateRange":"","days":[{"id":"b11-d1","date":null,"index":0,"weekday":"","title":"Performance & Diagnostics","hot":false,"timed":false,"topic":"Performance & Diagnostics","tiers":[{"level":20,"items":[{"id":"b11-q001","type":"question","text":"Crash-free rate dropped from 99.8% to 99.1% overnight. Walk me through your response, minute by minute.","number":"11.1","priority":"kill"},{"id":"b11-q002","type":"question","text":"Walk through cold, warm and hot start. How do you measure startup properly (Macrobenchmark, `reportFullyDrawn`, Play Vitals)?","number":"11.2","priority":"high"},{"id":"b11-q003","type":"question","text":"Cold start regressed by 400 ms after a release. Walk me through finding the cause.","number":"11.3","priority":"high"},{"id":"b11-q004","type":"question","text":"What causes jank? Explain the frame lifecycle and the budget at 60 Hz vs 120 Hz. How do you diagnose jank with Perfetto?","number":"11.4","priority":"high"},{"id":"b11-q005","type":"question","text":"An ANR happens when the main thread is blocked too long — how does the system detect it, and how do you debug one from Play Console data alone?","number":"11.5","priority":"high"},{"id":"b11-q006","type":"question","text":"Memory leak vs memory churn vs fragmentation — how do the symptoms differ? How does LeakCanary detect a leak, and what are typical leak sources in a Compose codebase?","number":"11.6","priority":"high"},{"id":"b11-q007","type":"question","text":"How do you approach a performance issue you cannot reproduce locally?","number":"11.7","priority":"high"},{"id":"b11-q008","type":"question","text":"What does R8 actually do? How do you debug a crash that only reproduces in a minified release build?","number":"11.8","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Твоя сильная зона — здесь нужны истории из ABM с цифрами, а не теория."}]},{"id":"b12","number":12,"title":"Kotlin & JVM","dateRange":"","days":[{"id":"b12-d1","date":null,"index":0,"weekday":"","title":"Kotlin & JVM","hot":false,"timed":false,"topic":"Kotlin & JVM","tiers":[{"level":20,"items":[{"id":"b12-q001","type":"question","text":"What does `inline` change in the generated bytecode, and when does inlining hurt? What problems do `noinline` and `crossinline` solve? Why does `reified` only work inside `inline`?","number":"12.1","priority":"high"},{"id":"b12-q002","type":"question","text":"How are `equals`/`hashCode` generated for a `data class`? A `data class` with a `var` field is put in a `HashSet`, then the field is mutated — what happens on `contains()`?","number":"12.2","priority":"high"},{"id":"b12-q003","type":"question","text":"`sealed class` vs `sealed interface` vs `enum` for UI state. What breaks at compile time vs runtime when you add a new subtype vs a new enum constant?","number":"12.3","priority":"high"},{"id":"b12-q004","type":"question","text":"How does `by lazy` work internally? What are the three `LazyThreadSafetyMode` options? `lateinit` vs `by lazy` vs nullable — trade-offs.","number":"12.4","priority":"high"},{"id":"b12-q005","type":"question","text":"What thread-safety guarantees does a Kotlin `object` give for its initialization, and how many instances exist in a multi-process app?","number":"12.5","priority":"high"},{"id":"b12-q006","type":"question","text":"Explain declaration-site vs use-site variance (`in`, `out`, star projection) with an example from a repository API. What is type erasure and how do you work around it?","number":"12.6","priority":"high"},{"id":"b12-q007","type":"question","text":"How would you model domain errors: exceptions, `Result`, or a sealed error type? Defend the choice.","number":"12.7","priority":"high"},{"id":"b12-q008","type":"question","text":"What is a value class (`@JvmInline`)? When does it still get boxed at runtime?","number":"12.8","priority":"high"},{"id":"b12-q009","type":"question","text":"`Sequence` vs `List` operator chains — when does `Sequence` actually win?","number":"12.9","priority":"high"},{"id":"b12-q010","type":"question","text":"Complexity of `ArrayList` vs `LinkedList` vs `HashMap` for insert/lookup/delete — and when does `HashMap` degrade? What breaks if `equals` is implemented without `hashCode`?","number":"12.10","priority":"high"},{"id":"b12-q011","type":"question","text":"Why are extension functions statically dispatched, and what surprising behaviour does that cause?","number":"12.11","priority":"high"},{"id":"b12-q012","type":"question","text":"Walk through SOLID, one letter at a time, with an example from a real codebase. Why \"composition over inheritance\", and when is inheritance still the right call?","number":"12.12","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Базовый слой. Спрашивают на скрине и как follow-up внутри других блоков — редко как отдельный раунд. Поэтому все ⭐, ни одного ⭐⭐: провалить один такой вопрос обычно не фатально, но провалить пять подряд — фатально."}]},{"id":"b13","number":13,"title":"Android Platform","dateRange":"","days":[{"id":"b13-d1","date":null,"index":0,"weekday":"","title":"Android Platform","hot":false,"timed":false,"topic":"Android Platform","tiers":[{"level":20,"items":[{"id":"b13-q001","type":"question","text":"**Google Play requires targetSdk 36 for new apps and updates from 31 August 2026.** What breaks when you bump: edge-to-edge can no longer be opted out of, `onBackPressed()` stops firing, apps on screens 600dp+ can no longer lock orientation or aspect ratio, and 16 KB page-size support is required for native libraries. Walk me through how you'd plan and QA that migration. *(идеальный вопрос для «что ты сделал недавно» — подготовь ответ по ABM)*","number":"13.1","priority":"high"},{"id":"b13-q002","type":"question","text":"What is the predictive back gesture, and what does adding proper support to an existing app require?","number":"13.2","priority":"high"},{"id":"b13-q003","type":"question","text":"WorkManager vs Foreground Service vs AlarmManager vs JobScheduler — give a decision matrix. How does WorkManager guarantee execution across process death and reboot?","number":"13.3","priority":"high"},{"id":"b13-q004","type":"question","text":"What changed with mandatory foreground service types and restricted exact alarms? How do Doze mode and App Standby buckets affect a background sync feature?","number":"13.4","priority":"high"},{"id":"b13-q005","type":"question","text":"Deep links vs App Links — how do you verify an App Link, debug failed verification, and prevent deep link hijacking?","number":"13.5","priority":"high"},{"id":"b13-q006","type":"question","text":"Runtime permissions: one-time grants, `POST_NOTIFICATIONS`, the photo picker and partial media access. How does the current photo/video model differ from SDK 33?","number":"13.6","priority":"high"},{"id":"b13-q007","type":"question","text":"How does the system decide to kill your process? Explain `onTrimMemory` and importance levels.","number":"13.7","priority":"high"},{"id":"b13-q008","type":"question","text":"Trace the build pipeline: sources → dex → APK/AAB → install → ART. Where do AOT, JIT and profile-guided compilation fit?","number":"13.8","priority":"high"},{"id":"b13-q009","type":"question","text":"Explain Binder IPC. What happens when an `Intent` crosses a process boundary?","number":"13.9","priority":"high"},{"id":"b13-q010","type":"question","text":"How would you support a device with no Google Play Services in a banking app?","number":"13.10","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Отобрано по принципу «спросят у senior в 2026», а не «есть в учебнике». Первый вопрос — новый, его не было в исходном банке: он актуален прямо сейчас."}]},{"id":"b14","number":14,"title":"Security (fintech)","dateRange":"","days":[{"id":"b14-d1","date":null,"index":0,"weekday":"","title":"Security (fintech)","hot":false,"timed":false,"topic":"Security (fintech)","tiers":[{"level":20,"items":[{"id":"b14-q001","type":"question","text":"Where do you store an auth token, and why not in SharedPreferences?","number":"14.1","priority":"high"},{"id":"b14-q002","type":"question","text":"The Android Keystore keeps keys inside the TEE or StrongBox — what guarantee do you actually get, and what do you *not*? What does hardware key attestation prove to your backend?","number":"14.2","priority":"high"},{"id":"b14-q003","type":"question","text":"`BiometricPrompt` with a `CryptoObject` — why does binding a key to biometrics matter?","number":"14.3","priority":"high"},{"id":"b14-q004","type":"question","text":"Pinning can be defeated by hooking on a rooted device — so what is the realistic role of root and hook detection?","number":"14.4","priority":"high"},{"id":"b14-q005","type":"question","text":"Walk through a pre-release security checklist: R8, HTTPS-only, `FLAG_SECURE`, `allowBackup`, exported components, no hardcoded secrets, dependency audit.","number":"14.5","priority":"high"},{"id":"b14-q006","type":"question","text":"Session management: idle timeout, step-up re-authentication, background screenshot blur.","number":"14.6","priority":"high"},{"id":"b14-q007","type":"question","text":"You're reviewing a PR that touches the payments flow. What specifically are you looking for?","number":"14.7","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Не отдельный раунд, но всплывает в system design, в разборе твоего проекта и в вопросах про платёжный флоу. Держи семь заготовленных ответов."}]},{"id":"b15","number":15,"title":"Behavioral","dateRange":"","days":[{"id":"b15-d1","date":null,"index":0,"weekday":"","title":"Behavioral","hot":false,"timed":false,"topic":"Behavioral","tiers":[{"level":20,"items":[{"id":"b15-q001","type":"question","text":"Tell me about yourself. *(2 минуты, отрепетированные, без филлеров)*","number":"15.1","priority":"high"},{"id":"b15-q002","type":"question","text":"**What were your key achievements and your low points in your last role?** *(прямая формулировка из плейбука Bar Raiser — будут копать на 2–3 слоя вглубь по каждому пункту)*","number":"15.2","priority":"high"},{"id":"b15-q003","type":"question","text":"Walk me through the most complex feature you shipped end to end.","number":"15.3","priority":"high"},{"id":"b15-q004","type":"question","text":"Tell me about a technical decision you later regretted.","number":"15.4","priority":"high"},{"id":"b15-q005","type":"question","text":"Tell me about a time you disagreed with your manager or tech lead.","number":"15.5","priority":"high"},{"id":"b15-q006","type":"question","text":"Tell me about a production incident you caused or fixed. What changed afterwards?","number":"15.6","priority":"high"},{"id":"b15-q007","type":"question","text":"Tell me about delivering with unclear or shifting requirements.","number":"15.7","priority":"high"},{"id":"b15-q008","type":"question","text":"Give an example of pushing back on scope or a deadline.","number":"15.8","priority":"high"},{"id":"b15-q009","type":"question","text":"Describe convincing others to adopt an approach they initially resisted.","number":"15.9","priority":"high"},{"id":"b15-q010","type":"question","text":"Tell me about the largest migration or refactor you led. How did you de-risk it?","number":"15.10","priority":"high"},{"id":"b15-q011","type":"question","text":"Tell me about mentoring someone. What concretely changed for them?","number":"15.11","priority":"high"},{"id":"b15-q012","type":"question","text":"Tell me about receiving hard feedback — and about a time you were wrong and a colleague was right.","number":"15.12","priority":"high"},{"id":"b15-q013","type":"question","text":"Tell me about a metric you moved. How did you measure it?","number":"15.13","priority":"high"},{"id":"b15-q014","type":"question","text":"How do you think about the trade-off between shipping speed, security and quality? *(N26 оценивает это по рубрике)*","number":"15.14","priority":"high"},{"id":"b15-q015","type":"question","text":"Why are you leaving your current role? Why this company? What does \"senior\" mean to you beyond writing code?","number":"15.15","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"**Не недооценивай этот блок.** У Revolut Bar Raiser — часовой финальный раунд, отдельно сертифицированный интервьюер, который копает **на 2–3 слоя вглубь** по каждому достижению. По опубликованному плейбуку: ждут амбиции, честности, высокого темпа; готовности назвать слабости **с доказательством, что ты над ними работал**; количественных достижений. Тот же интервьюер потом делает reference call по тем же темам — расхождения между твоим рассказом и рефересами видны. Плюс сигнал считается плохим, если текущий работодатель не пытался тебя удержать.\nУ Monzo — час, два интервьюера, **четыре вопроса** про коммуникацию, обучение, работу в команде и доставку проектов; интервьюеры могут быть не мобильными, поэтому контекст объясняй с нуля. У N26 — оценка по рубрике trade-off между скоростью, безопасностью и качеством.\n**Правила:** говори «я», а не «мы» — иначе теряется сигнал о личном вкладе. Держи цифры: ответы без метрик читаются как отсутствие ownership. Шести–восьми историй хватает на всё."}],"note":"**Матрица покрытия.** Проверь, что 6–8 историй закрывают: ownership · conflict · failure · ambiguity · influence · mentorship · prioritization · delivery under pressure · incident response · cross-functional work."},{"id":"b16","number":16,"title":"Algorithms","dateRange":"","days":[{"id":"b16-d1","date":null,"index":0,"weekday":"","title":"Algorithms","hot":false,"timed":false,"topic":"Algorithms","tiers":[{"level":20,"items":[{"id":"b16-q001","type":"question","text":"Merge Intervals / Meeting Rooms II — и **sweep line**: дан список интервалов доступности водителей, найди момент с максимальным числом доступных. *(реально названная задача с мобильного интервью)*","number":"16.1","priority":"high"},{"id":"b16-q002","type":"question","text":"LRU Cache *(пересекается с 2.5 — делай один раз, засчитывается в оба блока)*","number":"16.2","priority":"high"},{"id":"b16-q003","type":"question","text":"Top K Frequent Elements / Kth Largest *(heap)*","number":"16.3","priority":"high"},{"id":"b16-q004","type":"question","text":"Longest Substring Without Repeating Characters *(sliding window)*","number":"16.4","priority":"high"},{"id":"b16-q005","type":"question","text":"Two Sum / Group Anagrams *(hash map)*","number":"16.5","priority":"high"},{"id":"b16-q006","type":"question","text":"Binary Search: first/last occurrence + Search in Rotated Sorted Array","number":"16.6","priority":"high"},{"id":"b16-q007","type":"question","text":"Number of Islands + Binary Tree Level Order Traversal *(BFS/DFS)*","number":"16.7","priority":"high"},{"id":"b16-q008","type":"question","text":"Course Schedule *(topological sort)* + Coin Change *(базовый DP)*","number":"16.8","priority":"high"}]},{"level":40,"items":[]},{"level":60,"items":[]}],"prose":"Нужны для Bolt (HackerRank, 1 ч 15, medium–hard, с живым интервьюером) и Big Tech, где мобильные роли оценивают как обычные SWE-позиции. Для европейского финтеха (Revolut, Monzo, N26, Wise) — вторично: там задачи привязаны к банковским сценариям, а не к головоломкам.\n**Минимум, а не программа-максимум:**"}],"note":"**Про сложность:** amortized analysis, hash collisions, когда O(n log n) практически лучше O(n), space-time trade-offs."},{"id":"b17","number":17,"title":"English + вопросы интервьюеру","dateRange":"","days":[{"id":"b17-d1","date":null,"index":0,"weekday":"","title":"English + вопросы интервьюеру","hot":false,"timed":false,"topic":"English + вопросы интервьюеру","tiers":[{"level":20,"items":[{"id":"b17-q001","type":"question","text":"A two-minute self-introduction, without filler.","number":"17.1","priority":"high"},{"id":"b17-q002","type":"question","text":"A three-minute walkthrough of your app's architecture.","number":"17.2","priority":"high"},{"id":"b17-q003","type":"question","text":"A three-minute bug-hunt story with a clear resolution.","number":"17.3","priority":"high"},{"id":"b17-q004","type":"question","text":"Narrating code while writing it during live coding. *(отдельно тренируй — это неестественно)*","number":"17.4","priority":"high"},{"id":"b17-q005","type":"question","text":"Asking for clarification: *\"Just to make sure I understand correctly — are you asking about X or Y?\"*","number":"17.5","priority":"high"},{"id":"b17-q006","type":"question","text":"Buying time: *\"Let me think about that for a second.\"*","number":"17.6","priority":"high"},{"id":"b17-q007","type":"question","text":"Disagreeing politely: *\"I see it differently, and here's why.\"*","number":"17.7","priority":"high"},{"id":"b17-q008",
